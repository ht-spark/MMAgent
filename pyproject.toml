[project]
name = "MMAgent"
version = "1.1.0"
description = "通用数学建模竞赛智能体"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-openai",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pulp",
    "httpx",
    "tenacity",
    "openpyxl",
    "pytest",
    "pytest-asyncio",
    "python-docx",
    "tavily-python",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
    "llama-index",
    "torch",
    "qdrant-client",
    "modelscope",
    "langchain-huggingface",
    "sentence-transformers"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# server 是唯一常规包；scr 是运行时通过 sys.path 引入的命名空间包。
# web/artifacts/tests/examples 非 Python 包，需显式排除以免自动发现失败。
[tool.setuptools.packages.find]
where = ["."]
exclude = ["web*", "artifacts*", "tests*", "examples*"]
